services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: cupcake
      POSTGRES_PASSWORD: cupcake
      POSTGRES_DB: cupcake_dev
    ports:
      - "5432:5432"
    volumes:
      - cupcake_db_data:/var/lib/postgresql/data
      - ./packages/database/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cupcake -d cupcake_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cupcake_db_data:
