" style="stroke:#5B4A50;stroke-width:1.0;"/><line style="stroke:#5B4A50;stroke-width:1.0;" x1="435.25" x2="34" y1="373.8721" y2="373.8721"/><line style="stroke:#5B4A50;stroke-width:1.0;" x1="34" x2="34" y1="373.8721" y2="409.8721"/><polygon fill="#5B4A50" points="30,399.8721,34,409.8721,38,399.8721,34,403.8721" style="stroke:#5B4A50;stroke-width:1.0;"/><line style="stroke:#5B4A50;stroke-width:1.0;" x1="1406" x2="1406" y1="518.9268" y2="538.9268"/><polygon fill="#5B4A50" points="1402,528.9268,1406,538.9268,1410,528.9268,1406,532.9268" style="stroke:#5B4A50;stroke-width:1.0;"/><line style="stroke:#5B4A50;stroke-width:1.0;" x1="508.75" x2="508.75" y1="462.5752" y2="467.5752"/><line style="stroke:#5B4A50;stroke-width:1.0;" x1="508.75" x2="1406" y1="467.5752" y2="467.5752"/><line style="stroke:#5B4A50;stroke-width:1.0;" x1="1406" x2="1406" y1="467.5752" y2="482.5752"/><polygon fill="#5B4A50" points="1402,472.5752,1406,482.5752,1410,472.5752,1406,476.5752" style="stroke:#5B4A50;stroke-width:1.0;"/><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="101" x="608.75" y="63.4609">Web app (View)</text><text fill="#000000" font-family="Helvetica" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="152" x="1329" y="63.4609">API (Controller + Model)</text><!--MD5=[28a087b775a4b01fb2fd7e73c397d4b1]
@startuml ad-02-active-order-cards
!include ../_style.iuml
title AD-02 · Active-order cards on the home page (UC-04, BR-19)

|Web app (View)|
start
:Read "cupcake.orders" from localStorage\n(up to 5 codes, newest first);
if (Any stored order?) then (no)
  :Show no card;
  stop
else (yes)
endif
while (For each stored code) is (next code)
  :GET /api/orders/{code};
  |API (Controller + Model)|
  :Expire overdue orders (BR-20);
  :Find order by code;
  |Web app (View)|
  if (Response?) then (404)
    :Remove the stored code;
  elseif () then (network error)
    :Keep the code; show no card for it;
  else (200)
    if (pickupStatus = AWAITING_PICKUP?) then (yes)
      :Show card "Seu pedido · code ·\nAguardando retirada";
    else (PICKED_UP or EXPIRED)
      :Remove the stored code;
    endif
  endif
endwhile (done)
note right
  The day the order was placed does not matter.
  Cards exist only in this browser
  (no account, no history list, BR-19).
end note
stop
@enduml

