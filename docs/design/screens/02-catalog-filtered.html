<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo filtrado · Cupcake Store (UI reference)</title>
<!-- APPROVED UI REFERENCE (Phase 3). Source: Claude Design canvas "Cupcake Store Screens".
     Static mockup with sample data. Reproduce layout, spacing, colors, type and copy exactly;
     data, counts and states come from the API at runtime. See docs/04-ui-design.md. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#121117}a:hover{color:#ad1457}
.chip-scroll::-webkit-scrollbar{display:none}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 780px; overflow: hidden; background: #ffffff; color: #121117; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 24px; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid #e4e4eb;">
    <a href="01-catalog.html" style="font-weight: 800; font-size: 22px; line-height: 28px; letter-spacing: -0.02em; color: #121117; text-decoration: none;">Cupcake Store</a>
    <div style="display: flex; align-items: center; gap: 4px;">
      <a href="03-cart.html" aria-label="Carrinho, 7 itens" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid #121117; border-radius: 8px; color: #121117; font-weight: 600; font-size: 15px; text-decoration: none;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>Carrinho<span style="min-width: 22px; height: 22px; padding: 0 6px; border-radius: 999px; background: #ff7aac; font-weight: 700; font-size: 12px; line-height: 22px; text-align: center;">7</span></a>
    </div>
  </header>

  <main style="display: flex; flex-direction: column; gap: 20px; padding: 24px 16px 32px;">
    <a href="05-my-order.html" aria-label="Seu pedido CUP-7K3Q9F, aguardando retirada" style="display: flex; align-items: center; gap: 12px; padding: 12px 12px 12px 16px; border-radius: 8px; background: #f4f4f6; color: #121117; text-decoration: none;">
      <span style="flex: 1; min-width: 0; display: flex; flex-direction: column;"><span style="font-size: 13px; line-height: 18px; color: #5c5b6b;">Seu pedido</span><span style="font-weight: 700; font-size: 16px; line-height: 22px; letter-spacing: 0.03em; font-variant-numeric: tabular-nums;">CUP-7K3Q9F</span></span>
      <span style="flex: none; display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 8px; background: #e3ebff; color: #1f4fd1; font-weight: 600; font-size: 12px;">Aguardando retirada</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><path d="m9 18 6-6-6-6"></path></svg>
    </a>

    <div role="toolbar" aria-label="Filtrar cupcakes" class="chip-scroll" style="display: flex; flex-wrap: nowrap; gap: 8px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; -ms-overflow-style: none; margin: 0 -16px; padding: 0 16px;">
      <a href="01-catalog.html" style="flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #8f8e9e; color: #121117; font-weight: 600; font-size: 14px; text-decoration: none;">Todos</a>
      <a href="02-catalog-filtered.html" style="flex: none; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #8f8e9e; color: #121117; font-weight: 600; font-size: 14px; text-decoration: none;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>Mais vendidos</a>
      <a href="02-catalog-filtered.html" style="flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #8f8e9e; color: #121117; font-weight: 600; font-size: 14px; text-decoration: none;">Clássicos</a>
      <a href="02-catalog-filtered.html" aria-pressed="true" style="flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #121117; background: #121117; color: #ffffff; font-weight: 600; font-size: 14px; text-decoration: none;">Chocolate</a>
      <a href="02-catalog-filtered.html" style="flex: none; display: inline-flex; align-items: center; height: 40px; padding: 0 16px; border-radius: 8px; border: 1px solid #8f8e9e; color: #121117; font-weight: 600; font-size: 14px; text-decoration: none;">Frutados</a>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 16px;">
      <article style="display: flex; flex-direction: column; gap: 12px; min-width: 0;">
        <div style="position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: #f4f4f6;">
          <img src="../assets/photos/chocolate-crush.jpg" alt="Cupcake de chocolate com cobertura de chocolate" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          <span style="position: absolute; top: 8px; left: 8px; display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 8px; background: #ffffff; font-weight: 600; font-size: 12px;"><svg width="13" height="13" viewBox="0 0 24 24" fill="#121117" stroke="#121117" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"></path></svg>Mais vendido</span>
          <div role="group" aria-label="Quantidade de Chocolate Crush" style="position: absolute; right: 8px; bottom: 8px; display: inline-flex; align-items: center; height: 40px; border-radius: 8px; background: #ffffff;">
            <button type="button" aria-label="Diminuir" style="width: 36px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <output style="min-width: 20px; text-align: center; font-weight: 600; font-size: 15px;">2</output>
            <button type="button" aria-label="Aumentar" style="width: 36px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-weight: 700; font-size: 16px; line-height: 22px;">Chocolate Crush</h2>
          <span style="font-weight: 600; font-size: 15px; line-height: 22px; font-variant-numeric: tabular-nums;">R$ 11,90</span>
          <p style="margin: 0; font-size: 14px; line-height: 20px; color: #5c5b6b;">Chocolate · ganache</p>
        </div>
      </article>

      <article style="display: flex; flex-direction: column; gap: 12px; min-width: 0;">
        <div style="position: relative; aspect-ratio: 1 / 1; border-radius: 8px; overflow: hidden; background: #f4f4f6;">
          <img src="../assets/photos/cookies-and-cream.jpg" alt="Cupcake de chocolate com creme de biscoito" style="width: 100%; height: 100%; object-fit: cover; display: block;">
          <div role="group" aria-label="Quantidade de Cookies &amp; Cream" style="position: absolute; right: 8px; bottom: 8px; display: inline-flex; align-items: center; height: 40px; border-radius: 8px; background: #ffffff;">
            <button type="button" aria-label="Diminuir" style="width: 36px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
            <output style="min-width: 20px; text-align: center; font-weight: 600; font-size: 15px;">3</output>
            <button type="button" aria-label="Aumentar" disabled="" style="width: 36px; height: 40px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8f8e9e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 2px;">
          <h2 style="margin: 0; font-weight: 700; font-size: 16px; line-height: 22px;">Cookies &amp; Cream</h2>
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;"><span style="font-weight: 600; font-size: 15px; line-height: 22px; font-variant-numeric: tabular-nums;">R$ 12,90</span><span style="display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 8px; background: #fff0c7; color: #7a4e00; font-weight: 600; font-size: 12px;">Restam 3</span></div>
          <p role="status" style="margin: 0; font-size: 13px; line-height: 18px; color: #7a4e00;">Máximo disponível.</p>
        </div>
      </article>
    </div>
  </main>

  <div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 24px; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 8px; background: #121117; color: #ffffff; box-shadow: 0 8px 24px rgba(18, 17, 23, 0.16); font-weight: 500; font-size: 15px; line-height: 20px;">
    <span style="flex: 1;">Adicionado ao carrinho</span>
    <a href="03-cart.html" style="color: #ffffff; font-weight: 600; text-underline-offset: 3px;">Ver carrinho</a>
  </div>
</div>
</body>
</html>
