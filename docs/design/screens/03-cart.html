<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrinho · Cupcake Store (UI reference)</title>
<!-- APPROVED UI REFERENCE (Phase 3). Source: Claude Design canvas "Cupcake Store Screens".
     Static mockup with sample data. Reproduce layout, spacing, colors, type and copy exactly;
     data, counts and states come from the API at runtime. See docs/04-ui-design.md. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
*{box-sizing:border-box}
a{color:#121117}a:hover{color:#ad1457}
</style>
</head>
<body>
<div style="position: relative; width: 390px; height: 860px; overflow: hidden; background: #ffffff; color: #121117; font-family: 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 24px; display: flex; flex-direction: column;">

  <header style="display: flex; align-items: center; gap: 4px; padding: 8px 16px 8px 8px; border-bottom: 1px solid #e4e4eb;">
    <a href="01-catalog.html" aria-label="Voltar" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 8px;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg></a>
    <h1 style="margin: 0; font-weight: 800; font-size: 20px; line-height: 26px; letter-spacing: -0.01em;">Carrinho</h1>
  </header>

  <main style="flex: 1; display: flex; flex-direction: column; gap: 24px; padding: 8px 16px 24px;">
    <section aria-label="Itens" style="display: flex; flex-direction: column;">
      <div style="display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; align-items: center; padding: 16px 0; border-bottom: 1px solid #e4e4eb;">
        <img src="../assets/photos/chocolate-crush.jpg" alt="" style="grid-row: 1 / 3; width: 92px; height: 92px; border-radius: 8px; object-fit: cover; display: block;">
        <div style="min-width: 0; display: flex; flex-direction: column;"><h2 style="margin: 0; font-weight: 700; font-size: 16px; line-height: 22px;">Chocolate Crush</h2><span style="font-size: 14px; line-height: 20px; color: #5c5b6b; font-variant-numeric: tabular-nums;">R$ 11,90</span></div>
        <button type="button" aria-label="Remover Chocolate Crush" style="justify-self: end; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c5b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg></button>
        <div role="group" aria-label="Quantidade de Chocolate Crush" style="justify-self: start; display: inline-flex; align-items: center; height: 40px; border-radius: 8px; border: 1px solid #8f8e9e;">
          <button type="button" aria-label="Diminuir" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <output style="min-width: 24px; text-align: center; font-weight: 600; font-size: 15px;">2</output>
          <button type="button" aria-label="Aumentar" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
        </div>
        <span style="justify-self: end; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums;">R$ 23,80</span>
      </div>

      <div style="display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; align-items: center; padding: 16px 0; border-bottom: 1px solid #e4e4eb;">
        <img src="../assets/photos/strawberry-kiss.jpg" alt="" style="grid-row: 1 / 3; width: 92px; height: 92px; border-radius: 8px; object-fit: cover; display: block;">
        <div style="min-width: 0; display: flex; flex-direction: column;"><h2 style="margin: 0; font-weight: 700; font-size: 16px; line-height: 22px;">Strawberry Kiss</h2><span style="font-size: 14px; line-height: 20px; color: #5c5b6b; font-variant-numeric: tabular-nums;">R$ 11,90</span></div>
        <button type="button" aria-label="Remover Strawberry Kiss" style="justify-self: end; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c5b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg></button>
        <div role="group" aria-label="Quantidade de Strawberry Kiss" style="justify-self: start; display: inline-flex; align-items: center; height: 40px; border-radius: 8px; border: 1px solid #8f8e9e;">
          <button type="button" aria-label="Diminuir" disabled="" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8f8e9e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <output style="min-width: 24px; text-align: center; font-weight: 600; font-size: 15px;">1</output>
          <button type="button" aria-label="Aumentar" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
        </div>
        <span style="justify-self: end; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums;">R$ 11,90</span>
      </div>

      <div style="display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; column-gap: 12px; row-gap: 8px; align-items: center; padding: 16px 0; border-bottom: 1px solid #e4e4eb;">
        <img src="../assets/photos/birthday-vanilla.jpg" alt="" style="grid-row: 1 / 3; width: 92px; height: 92px; border-radius: 8px; object-fit: cover; display: block;">
        <div style="min-width: 0; display: flex; flex-direction: column;"><h2 style="margin: 0; font-weight: 700; font-size: 16px; line-height: 22px;">Birthday Vanilla</h2><span style="font-size: 14px; line-height: 20px; color: #5c5b6b; font-variant-numeric: tabular-nums;">R$ 9,90</span></div>
        <button type="button" aria-label="Remover Birthday Vanilla" style="justify-self: end; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5c5b6b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path><line x1="10" x2="10" y1="11" y2="17"></line><line x1="14" x2="14" y1="11" y2="17"></line></svg></button>
        <div role="group" aria-label="Quantidade de Birthday Vanilla" style="justify-self: start; display: inline-flex; align-items: center; height: 40px; border-radius: 8px; border: 1px solid #8f8e9e;">
          <button type="button" aria-label="Diminuir" disabled="" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8f8e9e" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
          <output style="min-width: 24px; text-align: center; font-weight: 600; font-size: 15px;">1</output>
          <button type="button" aria-label="Aumentar" style="width: 38px; height: 38px; display: flex; align-items: center; justify-content: center; padding: 0; border: 0; border-radius: 8px; background: transparent;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#121117" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></button>
        </div>
        <span style="justify-self: end; font-weight: 600; font-size: 15px; font-variant-numeric: tabular-nums;">R$ 9,90</span>
      </div>
    </section>

    <section aria-label="Total" style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 8px; background: #f4f4f6;">
      <div style="display: flex; justify-content: space-between; font-size: 15px;"><span>Subtotal (4 itens)</span><span style="font-variant-numeric: tabular-nums;">R$ 45,60</span></div>
      <div style="display: flex; justify-content: space-between; font-size: 15px; color: #5c5b6b;"><span>Retirada na loja</span><span>Grátis</span></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid #e4e4eb; padding-top: 12px;"><span style="font-weight: 700;">Total</span><span style="font-weight: 800; font-size: 22px; line-height: 28px; font-variant-numeric: tabular-nums;">R$ 45,60</span></div>
    </section>
  </main>

  <div style="position: sticky; bottom: 0; padding: 12px 16px 20px; background: #ffffff; border-top: 1px solid #e4e4eb; border-style: none">
    <a href="04-checkout.html" style="display: flex; align-items: center; justify-content: center; min-height: 48px; border-radius: 8px; background: #ff7aac; color: #121117; font-weight: 600; font-size: 16px; text-decoration: none;">Continuar</a>
  </div>
</div>
</body>
</html>
